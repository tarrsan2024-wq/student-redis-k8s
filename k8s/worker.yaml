apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-worker-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-worker
  template:
    metadata:
      labels:
        app: task-worker
    spec:
      containers:
      - name: worker-container
        image: 24mis0060/task-worker:713e64d
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
